<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Послание духов</title>
  <!-- site deploy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Neucha&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="fog" aria-hidden="true"></div>
  <div class="motes" id="motes" aria-hidden="true"></div>

  <main class="stage">
    <div class="rune-ring" id="runeRing" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.8">
        <circle cx="100" cy="100" r="94" stroke-dasharray="1 6" opacity="0.55" />
        <circle cx="100" cy="100" r="86" stroke-width="0.4" opacity="0.25" />
        <circle cx="100" cy="100" r="57" stroke-dasharray="12 9" opacity="0.3" />

        <g opacity="0.5">
          <line x1="100" y1="86" x2="100" y2="94" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(30 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(60 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(90 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(120 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(150 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(180 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(210 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(240 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(270 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(300 100 100)" />
          <line x1="100" y1="86" x2="100" y2="94" transform="rotate(330 100 100)" />
        </g>

        <defs>
          <path id="ringStar"
            d="M0 -4.2 Q0.7 -0.9 4.2 0 Q0.7 0.9 0 4.2 Q-0.7 0.9 -4.2 0 Q-0.7 -0.9 0 -4.2 Z" />
        </defs>

        <g fill="currentColor" stroke="none">
          <use class="rune-star" href="#ringStar" transform="rotate(0 100 100) translate(100 74)" />
          <use class="rune-star" href="#ringStar" transform="rotate(90 100 100) translate(100 74)" />
          <use class="rune-star" href="#ringStar" transform="rotate(180 100 100) translate(100 74)" />
          <use class="rune-star" href="#ringStar" transform="rotate(270 100 100) translate(100 74)" />
          <use class="rune-star" href="#ringStar" transform="rotate(45 100 100) translate(100 74) scale(0.55)" />
          <use class="rune-star" href="#ringStar" transform="rotate(135 100 100) translate(100 74) scale(0.55)" />
          <use class="rune-star" href="#ringStar" transform="rotate(225 100 100) translate(100 74) scale(0.55)" />
          <use class="rune-star" href="#ringStar" transform="rotate(315 100 100) translate(100 74) scale(0.55)" />
        </g>
      </svg>
    </div>

    <button type="button" class="touch-btn" id="touchBtn" aria-label="Послание духов">
      <span class="touch-btn__label shaking" id="touchLabel"></span>
    </button>

    <p class="oracle" id="oracle" hidden aria-live="polite"></p>
  </main>

  <div class="vignette" aria-hidden="true"></div>

  <script src="script.js?v=15"></script>
</body>
</html>
